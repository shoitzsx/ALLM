name: ALM Database - instalacao limpa PG17

# Execucao automatica pausada: GitHub Actions do repositorio bloqueado
# por faturamento. Manter possibilidade de disparo manual quando regularizado.
# Enquanto isso: bash supabase/tests/testar-banco.sh (Git Bash, testes em memoria).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-clean-install:
    name: Migrations + RLS + roles + concorrencia
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alm_ci_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alm_ci_clean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ALM_DB_TEST_DEPS: /tmp/alm-db-deps
      ALM_LOCAL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alm_ci_clean
      PGPASSWORD: postgres
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Dependencias apenas para testes
        run: npm install --prefix "$ALM_DB_TEST_DEPS" --no-save --no-audit --no-fund pg @electric-sql/pglite libpg-query

      - name: Aplicar migrations do zero no PG17 isolado
        run: node supabase/tests/apply-clean.mjs

      - name: Testar SQL, SET ROLE real e concorrencia
        run: node supabase/tests/run-database.mjs --local

      - name: Testar invariantes WebAuthn no PostgreSQL 17
        env:
          ALM_DB_TEST_DISPOSABLE: YES
          PGPASSWORD: postgres
        run: node supabase/tests/test-webauthn-n2.mjs

      - name: Preparar login efemero e dependencias do backend
        env:
          PGPASSWORD: postgres
        run: |
          psql "$ALM_LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE alm_runtime_api LOGIN NOINHERIT NOSUPERUSER
            NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD 'local-api-only';
          GRANT alm_api TO alm_runtime_api
            WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          SQL
          npm ci --prefix backend --no-audit --no-fund

      - name: Testar fluxo HTTP WebAuthn completo
        env:
          ALM_DB_TEST_DISPOSABLE: YES
          ALM_DB_HOST: 127.0.0.1
          ALM_DB_PORT: 5432
          ALM_DB_NAME: alm_ci_clean
          ALM_DB_API_USER: alm_runtime_api
          ALM_DB_API_PASSWORD: local-api-only
          ALM_DB_SSL_MODE: disable
          ALM_PIN_PEPPER_V1: local-integration-pepper-with-at-least-32-characters
          ALM_WEBAUTHN_RP_ID: localhost
          ALM_WEBAUTHN_ORIGINS: http://localhost:5173
        run: npm --prefix backend run test:postgres
